<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mirthovia — IG Caption</title>
  <style>
    :root { --coral: #FF8FA3; --mint: #8ECFC1; --ink: #3a2e2e; }
    body { font-family: -apple-system, "Segoe UI", sans-serif; background: #fff8f0; color: var(--ink); margin: 0; padding: 32px 16px; }
    .wrap { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.2rem; }
    .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 6px 24px rgba(0,0,0,0.08); }
    textarea { width: 100%; box-sizing: border-box; min-height: 220px; border-radius: 10px; border: 2px solid #eee; padding: 12px; font-size: 0.9rem; font-family: inherit; }
    button { margin-top: 12px; width: 100%; background: var(--coral); color: #fff; border: none; border-radius: 999px; padding: 12px; font-weight: 700; cursor: pointer; }
    .error-box { background: #fff0f0; border: 2px solid #ffc1c1; border-radius: 14px; padding: 16px; color: #8a2a2a; }
    a.back { display: inline-block; margin-top: 16px; color: var(--ink); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>✨ Instagram caption — {{ name }}</h1>
    {% if error %}
      <div class="error-box"><strong>Couldn't generate caption.</strong><p>{{ error }}</p></div>
    {% else %}
      <div class="card">
        <textarea id="captionBox" readonly>{{ caption }}</textarea>
        <button onclick="copyIt()">📋 Copy to clipboard</button>
      </div>
    {% endif %}
    <a class="back" href="javascript:window.close()">← close this tab</a>
  </div>
  <script>
    function copyIt() {
      const box = document.getElementById("captionBox");
      box.select();
      navigator.clipboard.writeText(box.value).then(() => {
        const btn = document.querySelector("button");
        btn.textContent = "✅ Copied!";
        setTimeout(() => btn.textContent = "📋 Copy to clipboard", 1500);
      });
    }
  </script>
</body>
</html>
