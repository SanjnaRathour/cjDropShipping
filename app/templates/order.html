<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mirthovia — Place Order</title>
  <style>
    :root { --coral: #FF8FA3; --mint: #8ECFC1; --ink: #3a2e2e; }
    body { font-family: -apple-system, "Segoe UI", sans-serif; background: #fff8f0; color: var(--ink); margin: 0; padding: 32px 16px; }
    .wrap { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.3rem; }
    .card { background: #fff; border-radius: 18px; padding: 22px; box-shadow: 0 6px 24px rgba(0,0,0,0.08); }
    label { display: block; font-size: 0.8rem; font-weight: 700; margin: 14px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 2px solid #eee; font-size: 0.95rem; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { margin-top: 20px; width: 100%; background: var(--coral); color: #fff; border: none; border-radius: 999px; padding: 13px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .success { background: #eafff3; border: 2px solid var(--mint); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
    .error-box { background: #fff0f0; border: 2px solid #ffc1c1; border-radius: 14px; padding: 18px; color: #8a2a2a; margin-bottom: 18px; }
    a.back { display: inline-block; margin-top: 16px; color: var(--ink); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📦 Place CJ order — {{ product_name }}</h1>

    {% if result %}
      <div class="success">
        <strong>Order placed!</strong>
        <p>Order number: {{ result.order_number }}</p>
        <p>CJ response: {{ result }}</p>
      </div>
    {% endif %}
    {% if error %}
      <div class="error-box"><strong>Order failed.</strong><p>{{ error }}</p></div>
    {% endif %}

    <div class="card">
      <form method="post" action="/order">
        <input type="hidden" name="vid" value="{{ vid }}">
        <input type="hidden" name="product_name" value="{{ product_name }}">

        <label>Customer name</label>
        <input name="customer_name" required>

        <label>Mobile number</label>
        <input name="mobile" required>

        <label>Address</label>
        <input name="address" required>

        <div class="row2">
          <div>
            <label>City</label>
            <input name="city" required>
          </div>
          <div>
            <label>State / Province</label>
            <input name="province" required>
          </div>
        </div>

        <div class="row2">
          <div>
            <label>ZIP / Postal code</label>
            <input name="zip_code" required>
          </div>
          <div>
            <label>Country code</label>
            <input name="country_code" placeholder="e.g. IN, US" required>
          </div>
        </div>

        <label>Country name (CJ requires both code and full name)</label>
        <input name="country_name" placeholder="e.g. India, United States" required>

        <label>Quantity</label>
        <input name="quantity" type="number" value="1" min="1" required>

        <button class="btn" type="submit">Place order on CJ</button>
      </form>
    </div>
    <a class="back" href="/">← back to today's pick</a>
    &nbsp;·&nbsp;
    <a class="back" href="/orders">View all orders →</a>
  </div>
</body>
</html>
